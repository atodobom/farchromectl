<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>farchromectl — opções</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f1115; color: #e8eaf0;
      max-width: 480px; margin: 2rem auto; padding: 0 1rem;
    }
    h1 { font-size: 1.2rem; color: #4f8cff; }
    label { display: block; margin: 1rem 0 0.25rem; color: #8b93a7; font-size: 0.9rem; }
    input {
      width: 100%; padding: 10px; font-size: 1rem;
      background: #1f2430; color: #e8eaf0;
      border: 1px solid #2a3040; border-radius: 8px;
    }
    button {
      margin-top: 1.25rem; padding: 10px 22px; font-size: 1rem;
      background: #4f8cff; color: #fff; border: none; border-radius: 8px;
      cursor: pointer;
    }
    p.hint, p.status { color: #8b93a7; font-size: 0.85rem; }
    p.status { min-height: 1.2em; color: #37c978; }
    code { background: #1f2430; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>farchromectl — opções</h1>

  <label for="opt-port">Porta do servidor</label>
  <input id="opt-port" type="text" inputmode="numeric" placeholder="8080">

  <label for="opt-token">Token (PIN de 6 dígitos)</label>
  <input id="opt-token" type="text" inputmode="numeric" maxlength="6" placeholder="123456">

  <button id="opt-save">Salvar e reconectar</button>
  <p id="opt-status" class="status"></p>

  <p class="hint">
    O token e a porta aparecem no terminal quando o servidor
    <code>farchromectl</code> inicia no computador. Após salvar, a extensão
    reconecta automaticamente em alguns segundos.
  </p>

  <script src="options.js"></script>
</body>
</html>
